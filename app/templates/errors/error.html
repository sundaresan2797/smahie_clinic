{% extends "base.html" %}
{% import "components/macros.html" as ui with context %}
{% block content %}
<section class="error-page" aria-labelledby="page-title">
  <div class="container-xl error-page__inner">
    <p class="error-page__code" aria-hidden="true">{{ code }}</p>
    <p class="eyebrow">{{ title }}</p>
    <h1 class="error-page__title" id="page-title">{{ message }}</h1>
    <div class="btn-row btn-row--center">
      <a class="btn-soc btn-soc--primary" href="/">Back to home</a>
      <a class="btn-soc btn-soc--ghost" href="{{ clinic.tel_href }}">{{ ui.icon('phone', size=18) }} {{ clinic.phone_display }}</a>
    </div>
  </div>
</section>
{% endblock %}
