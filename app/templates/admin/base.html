<!doctype html>
<html lang="en-IN" class="admin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Admin{% endblock %} · {{ clinic.name }}</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preload" href="/static/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ static_url('vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ static_url('css/variables.css') }}">
  <link rel="stylesheet" href="{{ static_url('css/base.css') }}">
  <link rel="stylesheet" href="{{ static_url('css/components.css') }}">
  <link rel="stylesheet" href="{{ static_url('css/admin.css') }}">
</head>
<body class="admin-body">
  {% include "components/icons.html" %}
  <a class="skip-link" href="#main">Skip to main content</a>
  {% if admin %}
  <header class="admin-bar">
    <a class="admin-brand" href="/admin/appointments">
      <img src="{{ static_url('images/logo/emblem-96.png') }}" width="36" height="36" alt="">
      <span><strong>SMAHIE</strong> Ortho Care <small>Clinic admin</small></span>
    </a>
    <nav class="admin-nav" aria-label="Admin">
      <a href="/admin/appointments"{% if current_path.startswith('/admin/appointments') %} aria-current="page"{% endif %}>Appointments</a>
      <a href="/admin/messages"{% if current_path.startswith('/admin/messages') %} aria-current="page"{% endif %}>Messages</a>
      <a href="/" target="_blank" rel="noopener">View site</a>
    </nav>
    <div class="admin-user">
      <span class="admin-user__name">{{ admin.email }} <span class="admin-role">{{ admin.role }}</span></span>
      <form method="post" action="/admin/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf }}">
        <button class="admin-btn admin-btn--ghost" type="submit">Sign out</button>
      </form>
    </div>
  </header>
  {% endif %}
  <main id="main" class="admin-main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
