[project]
name = "smahie-ortho-care"
version = "1.0.0"
description = "Website and appointment request system for SMAHIE ORTHO CARE, Perungudi, Chennai"
requires-python = ">=3.11"
# Keep in sync with requirements.txt (Docker/VPS installs use that file).
dependencies = [
  "fastapi==0.165.0",
  "starlette==1.10.0",
  "uvicorn[standard]==0.54.0",
  "jinja2==3.1.6",
  "pydantic[email]==2.14.4",
  "pydantic-settings==2.16.3",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.34",
  "sqlalchemy==2.1.9",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "itsdangerous==2.2.0",
  "argon2-cffi==25.1.0",
  "tzdata==2026.6",
]

# ---- Vercel (see docs/DEPLOY_VERCEL.md) ----
[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
# Runs after dependencies are installed: applies migrations on production deploys.
build = "python -m scripts.vercel_build"

[tool.vercel.fastapi.static]
# Serve /static from Vercel's CDN even though the app has global (security-header) middleware.
cdn = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["venv", "node_modules", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI Depends()/Form() in argument defaults is idiomatic
  "RUF001",  # en dashes in user-facing copy are intentional
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]
"scripts/build_images.py" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: end-to-end tests that drive a real browser (Playwright)"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`", "ignore::pytest.PytestRemovedIn10Warning"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]
known-third-party = ["alembic"]
