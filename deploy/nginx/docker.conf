# Nginx config used by docker-compose.yml (HTTP on port 80).
# For HTTPS, terminate TLS here (mount certificates and add a 443 server block,
# see deploy/nginx/smahie.conf) or in front of this stack.

limit_req_zone $binary_remote_addr zone=smahie_forms:10m rate=12r/m;

upstream smahie_app {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/xml text/plain;

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    location ~ ^/(api/|appointment$|contact$|admin/login$) {
        limit_req zone=smahie_forms burst=10 nodelay;
        proxy_pass http://smahie_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://smahie_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
