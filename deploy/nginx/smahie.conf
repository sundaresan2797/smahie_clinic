# Nginx site for an Ubuntu VPS (app served by systemd/uvicorn on 127.0.0.1:8000).
# Install to /etc/nginx/sites-available/smahie and symlink into sites-enabled.
# Replace example.com with the real domain, then obtain certificates with:
#   sudo certbot --nginx -d example.com -d www.example.com

limit_req_zone $binary_remote_addr zone=smahie_forms:10m rate=12r/m;

upstream smahie_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://example.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.com;
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 64k;   # forms are small; no file uploads

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/xml text/plain;

    # Static assets: URLs carry a content hash (?v=...), so cache for a year.
    location /static/ {
        alias /srv/smahie/app/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Extra protection for form endpoints (the app also rate-limits).
    location ~ ^/(api/|appointment$|contact$|admin/login$) {
        limit_req zone=smahie_forms burst=10 nodelay;
        proxy_pass http://smahie_app;
        include /etc/nginx/snippets/smahie-proxy.conf;
    }

    location / {
        proxy_pass http://smahie_app;
        include /etc/nginx/snippets/smahie-proxy.conf;
    }
}
